server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /tls/localhost.crt;
    ssl_certificate_key /tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    # Requests may contain sensitive query strings, even when the API rejects them.
    access_log off;
    error_log /dev/null;
    server_tokens off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass https://api:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_ssl_trusted_certificate /tls/localhost.crt;
        proxy_ssl_verify on;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location /health/ {
        proxy_pass https://api:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_ssl_trusted_certificate /tls/localhost.crt;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
